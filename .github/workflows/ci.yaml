name: ci

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  id-token: write # mint the GitHub OIDC token used to assume the AWS role
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      matrix:
        node-version: [lts/*]

    steps:
      - name: Checkout ${{ github.sha }}
        uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          # TODO: can we further improve caching performance by caching node_modules directly,
          # given our platform and node version is constant (changes are the usual reason not
          # to as installs may vary on this)?
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Set up Turborepo caching
        uses: dtinth/setup-github-actions-caching-for-turbo@v1
      - name: Test, lint, build
        run: npx turbo test lint build

      # Deployment to dev environment
      - name: "server: Retrieve env for dev environment"
        if: github.ref == 'refs/heads/master'
        run: echo "$DEV_ENV" > apps/server/src/env/dev.ts
        env:
          DEV_ENV: ${{ secrets.DEV_ENV }}
      - name: Configure AWS credentials (OIDC)
        if: github.ref == 'refs/heads/master'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::338337944728:role/odir-ci
          aws-region: eu-west-1
      - name: Deploy to dev environment
        if: github.ref == 'refs/heads/master'
        run: npx turbo deploy:dev

      # Deployment to prod environment (server prod deploys stay manual: they
      # need src/env/prod.ts, which is deliberately not a CI secret)
      - name: "web: Deploy to prod environment"
        if: github.ref == 'refs/heads/master'
        run: npx turbo deploy:prod --filter @odir/web
